# Daily off-site backup of the Supabase data this app owns.
#
# Runs scripts/admin/backup.mjs (read-only — it never writes to Supabase),
# packs the resulting JSON into one archive, optionally encrypts it, and
# uploads it to Google Drive via rclone. Setup instructions, including how
# to produce every secret referenced below, are in
# scripts/admin/BACKUP_RESTORE.md.
name: Daily backup

on:
  schedule:
    # 20:30 UTC = 02:00 IST. GitHub runs scheduled jobs on a best-effort
    # basis and often starts them late under load, so treat this as "some
    # time after 2am", not an appointment.
    - cron: "30 20 * * *"
  # Lets you take a backup on demand — do this before any risky change in
  # the Supabase dashboard. Also resets GitHub's 60-day inactivity timer
  # (see BACKUP_RESTORE.md).
  workflow_dispatch:

# Two backup runs writing to Drive at once would be harmless but pointless.
concurrency:
  group: daily-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Where in Google Drive the archives land. The part before the ':' is
      # the rclone remote name and must match the one in your rclone config;
      # the part after is the folder. rclone creates that folder on first
      # run — don't pre-create it by hand (see BACKUP_RESTORE.md for why the
      # drive.file scope makes that matter).
      DRIVE_PATH: "sadhna-bhakt:sadhna-bhakt-backups"
      # Archives older than this are pruned after a successful upload.
      RETENTION: "180d"
      # A backup reporting fewer profiles than this is treated as a failed
      # export rather than a real one — see the sanity check below.
      MIN_PROFILES: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # backup.mjs only needs @supabase/supabase-js; the build toolchain
      # (vite, tailwind, oxlint) is irrelevant here.
      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Export data from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run admin:backup

      # The checkout is fresh and backups/ is gitignored, so the export above
      # left exactly one folder behind. Timestamped names sort chronologically
      # as text, so tail -n1 is the newest either way.
      - name: Locate the backup
        run: |
          set -euo pipefail
          dir=$(ls -1d backups/*/ | sed 's:/*$::' | sort | tail -n1)
          if [ -z "$dir" ]; then
            echo "::error::backup.mjs produced no output folder"
            exit 1
          fi
          echo "BACKUP_DIR=$dir" >> "$GITHUB_ENV"
          echo "STAMP=$(basename "$dir")" >> "$GITHUB_ENV"

      # Guards against the worst failure mode of an automated backup: it
      # keeps succeeding while quietly exporting nothing (wrong project,
      # rotated key, RLS change), and the pruning step below then ages out
      # the last good copies. A backup with no profiles in it is a bug.
      - name: Sanity-check the export
        run: |
          set -euo pipefail
          count=$(jq -r '.counts.profiles' "$BACKUP_DIR/manifest.json")
          echo "profiles in this backup: $count (minimum expected: $MIN_PROFILES)"
          if [ "$count" -lt "$MIN_PROFILES" ]; then
            echo "::error::Export returned $count profiles — refusing to upload or prune."
            exit 1
          fi

      # Encryption is opt-in: set the BACKUP_PASSPHRASE secret and archives
      # are AES256-encrypted before they leave the runner. Leave it unset and
      # they upload as plain .tar.gz. Read the warning in BACKUP_RESTORE.md
      # before turning it on — a lost passphrase means unreadable backups.
      - name: Package the backup
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          tar -czf "$STAMP.tar.gz" -C backups "$STAMP"
          if [ -n "${BACKUP_PASSPHRASE:-}" ]; then
            printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --quiet \
              --symmetric --cipher-algo AES256 \
              --pinentry-mode loopback --passphrase-fd 0 \
              --output "$STAMP.tar.gz.gpg" "$STAMP.tar.gz"
            rm -f "$STAMP.tar.gz"
            echo "ARCHIVE=$STAMP.tar.gz.gpg" >> "$GITHUB_ENV"
          else
            echo "::warning::BACKUP_PASSPHRASE is not set — uploading unencrypted."
            echo "ARCHIVE=$STAMP.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      # Secrets go through env, never interpolated into the script body.
      - name: Configure rclone
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Upload to Google Drive
        run: rclone copy "$ARCHIVE" "$DRIVE_PATH" --stats-one-line -v

      # Confirms the file is actually readable back from Drive before we
      # consider this run a success — an upload that "worked" but left
      # nothing behind is exactly the kind of thing you find out about too
      # late otherwise.
      - name: Verify the upload
        run: |
          set -euo pipefail
          if ! rclone lsf "$DRIVE_PATH" | grep -Fxq "$ARCHIVE"; then
            echo "::error::$ARCHIVE is not in $DRIVE_PATH after upload"
            exit 1
          fi
          echo "verified: $ARCHIVE"

      # Only runs once the upload above is verified, so a failed backup can
      # never delete good ones.
      - name: Prune old backups
        run: rclone delete "$DRIVE_PATH" --min-age "$RETENTION" -v

      - name: Summary
        run: |
          {
            echo "### Backup complete"
            echo ""
            echo "- Archive: \`$ARCHIVE\`"
            echo "- Destination: \`$DRIVE_PATH\`"
            echo "- Retention: archives older than \`$RETENTION\` pruned"
            echo ""
            echo "Row counts:"
            echo '```json'
            jq -r '.counts' "$BACKUP_DIR/manifest.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
